<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17344B">
  <title>Verificar imágenes — Compás Academy</title>
  <link rel="icon" type="image/png" href="brand/academy/favicon.png?v=11.1.0">
  <link rel="apple-touch-icon" href="brand/academy/apple-touch.png?v=11.1.0">
  <link rel="stylesheet" href="styles.css?v=6.0.15">
  <style>
    .verify-page{max-width:1200px;margin:auto;padding:30px}
    .verify-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
    .image-test{background:rgba(255,255,255,.72);padding:12px;border-radius:16px;border:1px solid rgba(10,36,69,.10);box-shadow:var(--shadow)}
    .image-test img{width:100%;height:150px;object-fit:contain;background:#f0ede7;border-radius:11px}
    .image-test strong,.image-test span{display:block;margin-top:8px;overflow-wrap:anywhere}
    .image-test span{color:var(--muted);font-size:.78rem}
    .ok{color:#287248!important}.bad{color:#a13f3f!important}
  </style>
</head>
<body>
  <main class="verify-page">
    <span class="eyebrow">Diagnóstico visual · V11.1</span>
    <h1 class="page-title">Iconos y portadas de Compás Academy</h1>
    <p class="page-subtitle">Estas son las rutas activas. Los recursos de marca viven en <strong>brand/academy</strong> y las portadas principales permanecen en la raíz del repositorio.</p>
    <p><a class="btn btn-primary" href="./">Regresar a Compás Academy</a> <a class="btn btn-secondary" href="limpiar-cache.html">Limpiar caché</a></p>
    <section class="verify-grid" id="verify-grid"></section>
  </main>
  <script>
    const VERSION = '11.1.0';
    const assets = [
      ['brand/academy/logo.png', 'Logo oficial Academy'],
      ['brand/academy/favicon.png', 'Favicon Academy'],
      ['brand/academy/apple-touch.png', 'Apple Touch Icon'],
      ['brand/academy/icon.svg', 'Icono PWA Academy'],
      ['curso-compas.webp', 'El Compás del Estratega'],
      ['curso-historia.webp', 'Elige tu historia más importante'],
      ['curso-ia.webp', 'IA para creadores'],
      ['curso-legado.webp', 'Legado que Trasciende'],
      ['curso-memoria.webp', 'Despierta tu memoria'],
      ['curso-mes.webp', 'Método MES®'],
      ['hero-lanzamiento.webp', 'Imagen principal de lanzamiento'],
      ['recurso-cuentos.webp', 'Recurso Cuentos'],
      ['recurso-manual.webp', 'Recurso Manual'],
      ['ruben.webp', 'Perfil Rubén']
    ];

    const grid = document.querySelector('#verify-grid');
    grid.innerHTML = assets.map(([src, label]) => `
      <article class="image-test">
        <img src="${src}?v=${VERSION}" alt="${label}">
        <strong>${label}</strong>
        <span>${src}</span>
        <span class="pending">Esperando imagen…</span>
      </article>
    `).join('');

    document.querySelectorAll('.image-test').forEach(card => {
      const img = card.querySelector('img');
      const status = card.querySelector('.pending');
      img.addEventListener('load', () => {
        status.textContent = 'Imagen cargada correctamente';
        status.className = 'ok';
      });
      img.addEventListener('error', () => {
        status.textContent = 'Archivo no encontrado';
        status.className = 'bad';
      });
      if (img.complete) {
        img.naturalWidth ? img.dispatchEvent(new Event('load')) : img.dispatchEvent(new Event('error'));
      }
    });
  </script>
</body>
</html>
