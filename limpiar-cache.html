<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17344B">
  <title>Actualizar Compás Academy</title>
  <link rel="icon" type="image/png" href="brand/academy/favicon.png?v=11.1.0">
  <link rel="apple-touch-icon" href="brand/academy/apple-touch.png?v=11.1.0">
  <link rel="stylesheet" href="styles.css?v=6.0.15">
  <link rel="stylesheet" href="academy-brand-v11.css?v=11.1.0">
</head>
<body>
  <main class="login-screen">
    <section class="login-card glass loading-card">
      <img class="official-lockup" src="brand/academy/logo.png?v=11.1.0" alt="Compás Academy" data-academy-brand-v11="official">
      <h1>Actualizando Compás Academy</h1>
      <p id="status">Eliminando iconos, imágenes y archivos guardados de la versión anterior…</p>
      <div class="spinner" id="spinner"></div>
      <a class="btn btn-primary hide" id="return-link" href="./">Regresar a Compás Academy</a>
    </section>
  </main>
  <script>
    (async () => {
      const status = document.querySelector('#status');
      const spinner = document.querySelector('#spinner');
      const link = document.querySelector('#return-link');

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }

        localStorage.removeItem('aula_v2_logged_in');
        sessionStorage.clear();

        status.textContent = 'La versión anterior fue eliminada. Ya puedes cargar los iconos y portadas nuevas.';
      } catch (error) {
        console.error(error);
        status.textContent = 'Se limpió lo posible. Ya puedes regresar a Compás Academy.';
      }

      spinner.classList.add('hide');
      link.classList.remove('hide');
      setTimeout(() => location.replace('./?actualizacion=11.1.0'), 1800);
    })();
  </script>
</body>
</html>
