name: Academy Push V34 checks

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-v34:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check academy-push-v34.js
          node --check bootstrap.js
          node --check sw.js
          node --check supabase-config.js

      - name: Validate public Supabase configuration
        run: |
          test -s supabase-config.js
          grep -q "https://.*\.supabase\.co" supabase-config.js
          grep -q "publishableKey" supabase-config.js
          ! grep -qi "service_role\|serviceRole\|SUPABASE_SERVICE_ROLE" supabase-config.js
          ! grep -qi "TU-PROYECTO\|TU_SUPABASE\|YOUR_SUPABASE" supabase-config.js

      - name: Validate local assets linked by the Academy shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlsplit

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'''(?:href|src)=["']([^"']+)["']''', html, flags=re.I)
          local_assets = []
          for ref in refs:
              clean = ref.strip()
              if not clean or clean.startswith(('#', 'data:', 'mailto:', 'tel:', '//')):
                  continue
              parsed = urlsplit(clean)
              if parsed.scheme or parsed.netloc:
                  continue
              path = parsed.path.lstrip('./')
              if path.endswith(('.css', '.js')):
                  local_assets.append(path)

          missing = [path for path in sorted(set(local_assets)) if not Path(path).is_file() or Path(path).stat().st_size == 0]
          if missing:
              raise SystemExit('Missing or empty local Academy assets: ' + ', '.join(missing))
          print(f'Validated {len(set(local_assets))} local CSS/JS assets linked from index.html')
          PY

      - name: Validate PWA manifest
        run: |
          test -s manifest.json
          test -s brand/academy/icon.svg
          test -s brand/academy/apple-touch.png
          python -m json.tool manifest.json >/dev/null
          grep -q '"start_url": "./index.html#home"' manifest.json
          grep -q '"display": "standalone"' manifest.json
          grep -q 'brand/academy/icon.svg' manifest.json

      - name: Validate V34.1 assets, sound and wiring
        run: |
          test -s academy-push-v34.css
          test -s academy-push-v34.js
          test -s 35-academy-push-v34.sql
          grep -q "academy-push-v34.css?v=34.0.0" index.html
          grep -q "bootstrap.js?v=34.1.0" index.html
          grep -q "academy-push-v34.css?v=34.0.0" bootstrap.js
          grep -q "academy-push-v34.js?v=34.1.0" bootstrap.js
          grep -q "const VERSION = '34.1.0'" academy-push-v34.js
          grep -q "oscillator.type = 'triangle'" academy-push-v34.js
          grep -q "scheduleAlertTone(context, 740" academy-push-v34.js
          grep -q "scheduleAlertTone(context, 980" academy-push-v34.js
          grep -q "compas-academy-v34.1.0-push" sw.js
          grep -q "self.addEventListener('push'" sw.js
          grep -q "self.addEventListener('notificationclick'" sw.js
          grep -q "academy-push-v34.css?v=34.0.0" sw.js
          grep -q "academy-push-v34.js?v=34.1.0" sw.js
          grep -q "bootstrap.js?v=34.1.0" sw.js
          grep -q "register_academy_push_v34" 35-academy-push-v34.sql
          grep -q "academy_notification_push_v34" 35-academy-push-v34.sql
          grep -q "app_scope" 35-academy-push-v34.sql
          grep -q "supabase_realtime" 35-academy-push-v34.sql

      - name: Confirm safe migration scope
        run: |
          ! grep -qi "delete from\|truncate\|drop table" 35-academy-push-v34.sql
