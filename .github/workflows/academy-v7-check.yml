name: Compas Academy checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check academy-v7.js
          node --check academy-premium.js
          node --check academy-dashboard-v9.js
          node --check academy-ai-v10.js
          node --check academy-brand-v11.js
          node --check bootstrap.js
          node --check sw.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"

      - name: Validate Academy assets and P0 security
        run: |
          test -s brand/academy/favicon.png
          test -s brand/academy/logo.png
          test -s brand/academy/apple-touch.png
          test -s brand/academy/icon.svg
          test -f compas-evolution.svg
          test -f academy-v7-vars.css
          test -f academy-v7.css
          test -f academy-premium.css
          test -f academy-premium.js
          test -f academy-dashboard-v9.css
          test -f academy-dashboard-v9.js
          test -f academy-ai-v10.css
          test -f academy-ai-v10.js
          test -f academy-brand-v11.css
          test -f academy-brand-v11.js
          test -f 14-compas-academy-evolution.sql
          test -f 15-compas-academy-p0-security.sql
          grep -q "academy-brand-v11.js?v=11.1.0" bootstrap.js
          grep -q "academy-v7.js" bootstrap.js
          grep -q "academy-dashboard-v9.js" bootstrap.js
          grep -q "academy-ai-v10.js" bootstrap.js
          grep -q "academy-v7.css" index.html
          grep -q "academy-premium.css" index.html
          grep -q "academy-dashboard-v9.css" index.html
          grep -q "academy-ai-v10.css" index.html
          grep -q "academy-brand-v11.css?v=11.1.0" index.html
          grep -q "brand/academy/favicon.png?v=11.1.0" index.html
          grep -q "brand/academy/logo.png?v=11.1.0" index.html
          grep -q "brand/academy/icon.svg?v=11.1.0" manifest.json
          grep -q "compas-academy-v11.1.0-assets" sw.js
          grep -q "curso-compas.webp?v=11.1.0" sw.js
          grep -q "upgrade-insecure-requests" index.html
          grep -q "location.protocol === 'http:'" index.html
          grep -q "revoke execute on function public.admin_set_user_role" 15-compas-academy-p0-security.sql
          grep -q "aula.proyectocompas.com" CNAME
