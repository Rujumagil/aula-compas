name: Compas Academy checks

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check academy-v7.js
          node --check academy-premium.js
          node --check academy-dashboard-v9.js
          node --check academy-ai-v10.js
          node --check academy-brand-v11.js
          node --check academy-brand-v29.js
          node --check academy-brand-visibility-v29-1.js
          node --check academy-sidebar-user-v29-3.js
          node --check academy-experience-v30.js
          node --check academy-assessments-v14.js
          node --check academy-assessment-admin-v15.js
          node --check academy-certificates-v16.js
          node --check academy-notifications-v17.js
          node --check academy-admin-dashboard-v18.js
          node --check academy-onboarding-v19.js
          node --check academy-ai-personalization-v20.js
          node --check academy-community-v21.js
          node --check academy-accessibility-v22.js
          node --check academy-course-landings-v27.js
          node --check verificar-certificado-v16.js
          node --check bootstrap.js
          node --check sw.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"

      - name: Validate Academy assets and security layers
        run: |
          test -s brand/academy/favicon.png
          test -s brand/academy/logo.png
          test -s brand/academy/apple-touch.png
          test -s brand/academy/icon.svg
          test -s brand/academy/icon-ice.svg
          test -f academy-brand-v29.css
          test -f academy-brand-v29.js
          test -f academy-brand-visibility-v29-1.css
          test -f academy-brand-visibility-v29-1.js
          test -f academy-brand-hardfix-v29-2.css
          test -f academy-sidebar-user-v29-3.css
          test -f academy-sidebar-user-v29-3.js
          test -f academy-sidebar-user-v29-6.css
          test -f academy-experience-v30.css
          test -f academy-experience-v30.js
          test -f academy-assessments-v14.css
          test -f academy-assessment-admin-v15.css
          test -f academy-certificates-v16.css
          test -f academy-notifications-v17.css
          test -f academy-admin-dashboard-v18.css
          test -f academy-onboarding-v19.css
          test -f academy-community-v21.css
          test -f academy-community-v21.js
          test -f academy-accessibility-v22.css
          test -f academy-accessibility-v22.js
          test -f academy-course-landings-v27.css
          test -f academy-course-landings-v27.js
          test -f curso.html
          test -f verificar-certificado.html
          test -f 15-compas-academy-p0-security.sql
          test -f 16-academy-assessments.sql
          test -f 17-academy-assessments-option-security.sql
          test -f 18-academy-assessment-engine.sql
          test -f 19-academy-starter-assessment.sql
          test -f 20-academy-assessment-rpc-hardening.sql
          test -f 21-academy-assessment-admin.sql
          test -f 22-academy-verifiable-certificates.sql
          test -f 23-academy-certificate-issuance-fix.sql
          test -f 24-academy-notifications.sql
          test -f 25-academy-admin-dashboard.sql
          test -f 26-academy-onboarding.sql
          test -f 27-academy-community.sql
          test -f 28-academy-community-notification-path-fix.sql
          test -f 29-academy-community-performance.sql
          test -f 30-academy-accessibility.sql
          test -f 31-academy-p0-security-v23.sql
          test -f 32-academy-p0-fk-indexes-v24.sql
          test -f 33-academy-p0-rls-initplan-v25.sql
          test -f 34-academy-p0-rls-consolidation-v26.sql
          grep -q "private.admin_change_student_access_status_impl" 31-academy-p0-security-v23.sql
          grep -q "private.admin_grant_product_access_impl" 31-academy-p0-security-v23.sql
          grep -q "private.admin_set_user_role_impl" 31-academy-p0-security-v23.sql
          grep -q "private.delete_managed_course_impl" 31-academy-p0-security-v23.sql
          grep -q "security invoker" 31-academy-p0-security-v23.sql
          grep -q "revoke all on function public.is_aula_admin() from public, anon" 31-academy-p0-security-v23.sql
          grep -q "academy_contact_links_contact_id_idx" 32-academy-p0-fk-indexes-v24.sql
          grep -q "assessment_answers_question_id_idx" 32-academy-p0-fk-indexes-v24.sql
          grep -q "workspaces_created_by_idx" 32-academy-p0-fk-indexes-v24.sql
          ! grep -qi "drop table\|delete from\|truncate" 32-academy-p0-fk-indexes-v24.sql
          grep -q "(select auth.uid())" 33-academy-p0-rls-initplan-v25.sql
          grep -q "wm.workspace_id = workspaces.id" 33-academy-p0-rls-initplan-v25.sql
          grep -q "resources_authorized_read" 33-academy-p0-rls-initplan-v25.sql
          ! grep -qi "delete from\|truncate" 33-academy-p0-rls-initplan-v25.sql
          grep -q "courses_select_consolidated" 34-academy-p0-rls-consolidation-v26.sql
          grep -q "lessons_select_consolidated" 34-academy-p0-rls-consolidation-v26.sql
          grep -q "modules_select_consolidated" 34-academy-p0-rls-consolidation-v26.sql
          grep -q "resource_access_select" 34-academy-p0-rls-consolidation-v26.sql
          grep -q "student_access_select" 34-academy-p0-rls-consolidation-v26.sql
          grep -q "policyname like 'Administradores gestionan m%'" 34-academy-p0-rls-consolidation-v26.sql
          ! grep -qi "drop table\|delete from\|truncate" 34-academy-p0-rls-consolidation-v26.sql
          grep -q "academy-community-v21.js?v=21.0.0" bootstrap.js
          grep -q "academy-accessibility-v22.js?v=22.0.0" bootstrap.js
          grep -q "academy-course-landings-v27.js?v=27.0.0" bootstrap.js
          grep -q "academy-brand-v29.js?v=29.2.0" bootstrap.js
          grep -q "academy-brand-hardfix-v29-2.css?v=29.2.0" bootstrap.js
          grep -q "academy-sidebar-user-v29-3.css?v=29.3.0" bootstrap.js
          grep -q "academy-sidebar-user-v29-3.js?v=29.3.0" bootstrap.js
          grep -q "academy-experience-v30.css?v=30.0.0" bootstrap.js
          grep -q "academy-experience-v30.js?v=30.0.0" bootstrap.js
          grep -q "academy-accessibility-v22.css?v=22.0.0" index.html
          grep -q "academy-course-landings-v27.css?v=27.0.0" index.html
          grep -q "academy-brand-v29.css?v=29.2.0" index.html
          grep -q "academy-brand-hardfix-v29-2.css?v=29.2.0" index.html
          grep -q "academy-sidebar-user-v29-3.css?v=29.3.0" index.html
          grep -q "academy-sidebar-user-v29-6.css?v=29.6.0" index.html
          grep -q "academy-experience-v30.css?v=30.0.0" index.html
          grep -q "bootstrap.js?v=30.0.0" index.html
          grep -q "brand/academy/icon.svg?v=29.2.0" index.html
          grep -q "primeros-pasos-compas-one" academy-course-landings-v27.js
          grep -q "Temario previsto" academy-course-landings-v27.js
          grep -q "course-landing-app" curso.html
          grep -q "Saltar al contenido principal" index.html
          grep -q "prefers-reduced-motion" academy-accessibility-v22.css
          grep -q "prefers-reduced-motion" academy-experience-v30.css
          grep -q "aria-current" academy-accessibility-v22.js
          grep -q "aria-keyshortcuts" academy-experience-v30.js
          grep -q "Transcripción de la lección" academy-accessibility-v22.js
          grep -q "transcript_text" 30-academy-accessibility.sql
          grep -q "captions_url" 30-academy-accessibility.sql
          grep -q "accessibility_notes" 30-academy-accessibility.sql
          ! grep -qi "drop table\|delete from\|truncate" 30-academy-accessibility.sql
          grep -q "compas-academy-v30.0.0-premium-experience" sw.js
          grep -q "academy-accessibility-v22.js?v=22.0.0" sw.js
          grep -q "academy-accessibility-v22.css?v=22.0.0" sw.js
          grep -q "academy-course-landings-v27.js?v=27.0.0" sw.js
          grep -q "academy-course-landings-v27.css?v=27.0.0" sw.js
          grep -q "academy-brand-v29.js?v=29.2.0" sw.js
          grep -q "academy-brand-v29.css?v=29.2.0" sw.js
          grep -q "academy-brand-hardfix-v29-2.css?v=29.2.0" sw.js
          grep -q "academy-sidebar-user-v29-3.css?v=29.3.0" sw.js
          grep -q "academy-sidebar-user-v29-3.js?v=29.3.0" sw.js
          grep -q "academy-sidebar-user-v29-6.css?v=29.6.0" sw.js
          grep -q "academy-experience-v30.css?v=30.0.0" sw.js
          grep -q "academy-experience-v30.js?v=30.0.0" sw.js
          grep -q "brand/academy/icon-ice.svg?v=29.2.0" sw.js
          grep -q "bootstrap.js?v=30.0.0" sw.js
          grep -q "./curso.html" sw.js
          grep -q "upgrade-insecure-requests" index.html
          grep -q "aula.proyectocompas.com" CNAME
