name: Compas Academy checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check academy-v7.js
          node --check academy-premium.js
          node --check academy-dashboard-v9.js
          node --check academy-ai-v10.js
          node --check academy-brand-v11.js
          node --check academy-assessments-v14.js
          node --check academy-assessment-admin-v15.js
          node --check academy-certificates-v16.js
          node --check academy-notifications-v17.js
          node --check academy-admin-dashboard-v18.js
          node --check academy-onboarding-v19.js
          node --check academy-ai-personalization-v20.js
          node --check verificar-certificado-v16.js
          node --check bootstrap.js
          node --check sw.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"

      - name: Validate Academy assets and security layers
        run: |
          test -s brand/academy/favicon.png
          test -s brand/academy/logo.png
          test -s brand/academy/apple-touch.png
          test -s brand/academy/icon.svg
          test -f academy-assessments-v14.css
          test -f academy-assessment-admin-v15.css
          test -f academy-certificates-v16.css
          test -f academy-notifications-v17.css
          test -f academy-admin-dashboard-v18.css
          test -f academy-onboarding-v19.css
          test -f academy-onboarding-v19.js
          test -f academy-ai-personalization-v20.js
          test -f verificar-certificado.html
          test -f 15-compas-academy-p0-security.sql
          test -f 16-academy-assessments.sql
          test -f 17-academy-assessments-option-security.sql
          test -f 18-academy-assessment-engine.sql
          test -f 19-academy-starter-assessment.sql
          test -f 20-academy-assessment-rpc-hardening.sql
          test -f 21-academy-assessment-admin.sql
          test -f 22-academy-verifiable-certificates.sql
          test -f 23-academy-certificate-issuance-fix.sql
          test -f 24-academy-notifications.sql
          test -f 25-academy-admin-dashboard.sql
          test -f 26-academy-onboarding.sql
          grep -q "academy-assessments-v14.js?v=14.0.0" bootstrap.js
          grep -q "academy-assessment-admin-v15.js?v=15.0.0" bootstrap.js
          grep -q "academy-certificates-v16.js?v=16.0.0" bootstrap.js
          grep -q "academy-notifications-v17.js?v=17.0.0" bootstrap.js
          grep -q "academy-admin-dashboard-v18.js?v=18.0.0" bootstrap.js
          grep -q "academy-onboarding-v19.js?v=19.0.0" bootstrap.js
          grep -q "academy-ai-personalization-v20.js?v=20.0.0" bootstrap.js
          grep -q "academy-onboarding-v19.css?v=19.0.0" index.html
          grep -q "bootstrap.js?v=20.0.0" index.html
          grep -q "compas-academy-v20.0.0-assets" sw.js
          grep -q "academy-ai-personalization-v20.js?v=20.0.0" sw.js
          grep -q "academy-onboarding-v19.js?v=19.0.0" sw.js
          grep -q "academy-onboarding-v19.css?v=19.0.0" sw.js
          grep -q "upgrade-insecure-requests" index.html
          grep -q "academy_onboarding_profiles" 26-academy-onboarding.sql
          grep -q "enable row level security" 26-academy-onboarding.sql
          grep -q "revoke all on table public.academy_onboarding_profiles from public, anon" 26-academy-onboarding.sql
          grep -q "with check ((select auth.uid()) = user_id)" 26-academy-onboarding.sql
          grep -q "academyProfileContext" academy-ai-personalization-v20.js
          grep -q "academyLearningSignals" academy-ai-personalization-v20.js
          grep -q "objective_text" academy-ai-personalization-v20.js
          ! grep -q "email" academy-ai-personalization-v20.js
          ! grep -q "access_token" academy-ai-personalization-v20.js
          grep -q "aula.proyectocompas.com" CNAME
