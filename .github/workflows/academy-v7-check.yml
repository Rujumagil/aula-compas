name: Compas Academy checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check academy-v7.js
          node --check academy-premium.js
          node --check academy-dashboard-v9.js
          node --check academy-ai-v10.js
          node --check academy-brand-v11.js
          node --check academy-assessments-v14.js
          node --check academy-assessment-admin-v15.js
          node --check academy-certificates-v16.js
          node --check verificar-certificado-v16.js
          node --check bootstrap.js
          node --check sw.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"

      - name: Validate Academy assets, assessment and certificate security
        run: |
          test -s brand/academy/favicon.png
          test -s brand/academy/logo.png
          test -s brand/academy/apple-touch.png
          test -s brand/academy/icon.svg
          test -f academy-assessments-v14.css
          test -f academy-assessments-v14.js
          test -f academy-assessment-admin-v15.css
          test -f academy-assessment-admin-v15.js
          test -f academy-certificates-v16.css
          test -f academy-certificates-v16.js
          test -f verificar-certificado.html
          test -f verificar-certificado-v16.js
          test -f 15-compas-academy-p0-security.sql
          test -f 16-academy-assessments.sql
          test -f 17-academy-assessments-option-security.sql
          test -f 18-academy-assessment-engine.sql
          test -f 19-academy-starter-assessment.sql
          test -f 20-academy-assessment-rpc-hardening.sql
          test -f 21-academy-assessment-admin.sql
          test -f 22-academy-verifiable-certificates.sql
          test -f 23-academy-certificate-issuance-fix.sql
          grep -q "academy-assessments-v14.js?v=14.0.0" bootstrap.js
          grep -q "academy-assessment-admin-v15.js?v=15.0.0" bootstrap.js
          grep -q "academy-certificates-v16.js?v=16.0.0" bootstrap.js
          grep -q "academy-certificates-v16.css?v=16.0.0" index.html
          grep -q "bootstrap.js?v=16.0.0" index.html
          grep -q "compas-academy-v16.0.0-assets" sw.js
          grep -q "academy-certificates-v16.js?v=16.0.0" sw.js
          grep -q "verificar-certificado.html" sw.js
          grep -q "upgrade-insecure-requests" index.html
          grep -q "revoke all on public.assessment_options" 17-academy-assessments-option-security.sql
          grep -q "revoke insert, update, delete on public.assessment_attempts" 18-academy-assessment-engine.sql
          grep -q "private.start_assessment_attempt_impl" 20-academy-assessment-rpc-hardening.sql
          grep -q "private.get_assessment_manager_options_impl" 21-academy-assessment-admin.sql
          grep -q "grade_assessment_attempt" 21-academy-assessment-admin.sql
          grep -q "security invoker" 21-academy-assessment-admin.sql
          grep -q "private.issue_academy_certificate_impl" 22-academy-verifiable-certificates.sql
          grep -q "revoke insert, update, delete on public.certificates" 22-academy-verifiable-certificates.sql
          grep -q "certificate_public_registry" 22-academy-verifiable-certificates.sql
          grep -q "security invoker" 22-academy-verifiable-certificates.sql
          grep -q "cert_found" 23-academy-certificate-issuance-fix.sql
          grep -q "aula.proyectocompas.com" CNAME
